[package]
name = "canopy-mac-proto"
version = "0.0.0"
edition = "2021"
publish = false
description = "Throwaway prototype: Canopy's window, chrome overlay and page views on macOS."

# Standalone on purpose: it must not touch the main crate's dependencies or lock file.
[workspace]

[dependencies]
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
tao = "0.37"
wry = "=0.57.2"
libc = "0.2"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = [
    "NSArray",
    "NSData",
    "NSDate",
    "NSGeometry",
    "NSObjCRuntime",
    "NSProcessInfo",
    "NSRunLoop",
    "NSString",
    "NSURL",
] }
objc2-app-kit = { version = "0.3", features = [
    "NSEvent",
    "NSGraphics",
    "NSGraphicsContext",
    "NSResponder",
    "NSView",
    "NSWindow",
] }
objc2-web-kit = { version = "0.3", features = [
    "WKBackForwardList",
    "WKBackForwardListItem",
    "WKNavigation",
    "WKWebView",
    "objc2-app-kit",
] }

<!doctype html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8">
<title>Canopy chrome</title>
<link rel="stylesheet" href="chrome.css">
</head>
<body>
<header id="tabs">
  <button id="forest-button" class="label-button" title="Forest · Ctrl+E" aria-pressed="false"></button>
  <div class="tabs-divider"></div>
  <div id="tab-row" role="tablist" aria-label="Open trees"></div>
  <button id="tab-overflow" aria-haspopup="menu" aria-expanded="false" class="icon-button" title="More trees" aria-label="More trees" hidden></button>
  <button id="new-tree" class="icon-button" title="New tree · Ctrl+T" aria-label="New tree"></button>
  <div class="spacer"></div>
  <button id="page-scale" class="label-button" title="Reset page size · Ctrl+0" aria-label="Reset page size" hidden></button>
  <button id="login-chip" class="label-button" hidden></button>
  <button id="search-pill" title="Search your forest or go to an address · Ctrl+K"><span>Search or go…</span><kbd>Ctrl K</kbd></button>
  <div id="find-bar" role="search" aria-label="Find in page" hidden>
    <input id="find-input" aria-label="Find in page" placeholder="Find in page" spellcheck="false" autocomplete="off">
    <span id="find-count" aria-live="polite"></span>
    <i class="find-divider"></i>
    <button id="find-previous" class="find-button" title="Previous match · Shift+Enter" aria-label="Previous match"></button>
    <button id="find-next" class="find-button" title="Next match · Enter" aria-label="Next match"></button>
    <button id="find-close" class="find-button" title="Close · Esc" aria-label="Close find"></button>
  </div>
  <button id="settings-button" aria-haspopup="menu" aria-expanded="false" class="icon-button" title="Settings" aria-label="Settings"></button>
</header>

<section id="strip">
  <div id="strip-bg"></div>
  <div id="load-progress" role="progressbar" aria-label="Loading page" aria-valuemin="0" aria-valuemax="100" hidden><i></i></div>
  <div id="strip-placeholder" hidden>+ <span>A new tree starts here</span></div>
  <div id="strip-clip">
    <div id="strip-canvas">
      <div id="glow"></div>
      <svg id="strip-edges" width="1" height="1"></svg>
      <div id="strip-nodes"></div>
      <button id="memory-dot" aria-haspopup="menu" aria-expanded="false" aria-label="Saved text" hidden><i></i></button>
    </div>
  </div>
</section>
<div id="tree-sheet" class="overlay" role="dialog" aria-modal="true" aria-labelledby="tree-title" hidden>
  <div class="scrim"></div>
  <div class="sheet-box">
    <div class="sheet-head"><b id="tree-title"></b><span id="tree-detail"></span>
      <div class="segmented" id="tree-side" aria-label="Tree view"><button data-side="tree">Tree</button><button data-side="list">List</button></div>
    </div>
    <div class="tree-tools"><input id="tree-filter" type="search" placeholder="Filter by title" aria-label="Filter by title"><button id="tree-waiting" aria-pressed="false">Waiting only</button><span id="tree-empty" hidden>No matching pages</span></div>
    <div id="tree-board" class="sheet-body"><div id="tree-layer"><svg id="tree-edges"></svg><div id="tree-nodes" role="tree" aria-label="Pages"></div></div></div>
    <div id="tree-list" role="tree" aria-label="Pages" class="sheet-body" hidden></div>
  </div>
</div>
<div id="pins"><button id="waiting-pin" aria-haspopup="menu" aria-expanded="false" class="pin" data-pin="waiting" aria-label="Next waiting page" hidden></button><button id="mail-pin" class="pin" data-pin="mail" aria-haspopup="dialog" aria-expanded="false" aria-label="Unread mail" hidden></button><button id="zoom-pin" class="pin icon-pin" data-pin="zoom" aria-pressed="false" title="Zoom into this tree · Ctrl+Shift+E" aria-label="Zoom into this tree" hidden></button></div>

<div id="start" class="surface dapple" hidden>
  <div id="start-column">
    <button id="start-search"> <i class="caret"></i><span>An address, a search, or anything on this page</span><kbd>Ctrl K</kbd></button>
    <section id="trees-help" aria-labelledby="trees-help-title" hidden></section>
    <div id="start-content"></div>
  </div>
</div>

<div id="forest" class="overlay" role="dialog" aria-modal="true" aria-label="Forest" hidden>
  <div class="scrim"></div>
  <div class="forest-pop">
    <div class="forest-toolbar">
      <strong>Forest</strong>
      <span class="menu-detail" id="forest-count"></span>
      <div class="spacer"></div>
      <button class="action" id="forest-titles">Titles</button>
      <button class="action" id="forest-fit">Fit</button>
      <button class="action" id="forest-close" aria-label="Close the forest view">×</button>
    </div>
    <div id="forest-canvas" class="dapple">
      <div id="forest-layer"><svg id="forest-edges" width="1" height="1"></svg><div id="forest-nodes"></div></div>
    </div>
  </div>
</div>

<div id="strip-list" hidden></div>
<div id="popover" tabindex="-1" role="dialog" aria-label="Actions" hidden></div>

<div id="palette" role="dialog" aria-modal="true" aria-label="Search" hidden>
  <div class="scrim"></div>
  <div class="palette-box">
    <div class="palette-context" id="palette-context"></div>
    <div class="palette-field"><span id="palette-icon"></span><input id="palette-input" role="combobox" aria-label="Search your forest or type an address" aria-expanded="true" aria-autocomplete="list" aria-controls="palette-results" spellcheck="false" autocomplete="off" placeholder="Search your forest or type an address"></div>
    <div id="palette-results" role="listbox" aria-label="Results"></div>
    <div class="palette-foot">↑↓ choose · Enter open · Alt+Enter in a new tree · Esc close</div>
  </div>
</div>

<div id="form-return" hidden>
  <div class="scrim"></div>
  <div class="form-return-box" role="dialog" aria-modal="true" aria-labelledby="form-return-title">
    <h2 id="form-return-title">Return to a form result?</h2>
    <p>This page came from a form you sent. Opening it again may send the same data again, which can repeat an order or a payment.</p>
    <div><button id="form-return-cancel">Cancel</button><button id="form-return-continue">Continue</button></div>
  </div>
</div>
<div id="reader" role="dialog" aria-modal="true" aria-label="Saved text" hidden>
  <div class="scrim"></div>
  <div class="reader-box" id="reader-box"></div>
</div>

<div id="toast" hidden></div>
<div id="toast-status" class="live-region" role="status" aria-atomic="true"></div>
<div id="toast-alert" class="live-region" role="alert" aria-atomic="true"></div>

<script src="chrome.js"></script>
</body>
</html>

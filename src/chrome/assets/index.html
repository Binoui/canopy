<!doctype html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8">
<title>Canopy chrome</title>
<link rel="stylesheet" href="chrome.css">
</head>
<body>
<header id="tabs">
  <button id="forest-button" class="label-button" title="Forest · Ctrl+E" aria-pressed="false"></button>
  <div class="tabs-divider"></div>
  <div id="tab-row"></div>
  <button id="tab-overflow" class="icon-button" title="More trees" hidden></button>
  <button id="new-tree" class="icon-button" title="New tree · Ctrl+T" aria-label="New tree"></button>
  <div class="spacer"></div>
  <button id="login-chip" class="label-button" hidden></button>
  <button id="search-pill" title="Search your forest or go to an address · Ctrl+K"><span>Search or go…</span><kbd>Ctrl K</kbd></button>
  <button id="agent" class="icon-button" title="Agent · Coming soon" aria-label="Agent" disabled></button>
  <button id="settings-button" class="icon-button" title="Settings" aria-label="Settings"></button>
</header>

<section id="strip">
  <div id="strip-bg"></div>
  <div id="strip-placeholder" hidden>+ <span>A new tree starts here</span></div>
  <div id="strip-clip">
    <div id="strip-canvas">
      <div id="glow"></div>
      <svg id="strip-edges" width="1" height="1"></svg>
      <div id="strip-nodes"></div>
      <button id="memory-dot" aria-label="Memory" hidden><i></i></button>
    </div>
    <div class="fade" id="fade-left" hidden></div>
    <div class="fade" id="fade-right" hidden></div>
  </div>
</section>
<div id="tree-sheet" class="overlay" hidden>
  <div class="scrim"></div>
  <div class="sheet-box">
    <div class="sheet-head"><b id="tree-title"></b><span id="tree-detail"></span>
      <div class="segmented" id="tree-side" aria-label="Tree view"><button data-side="tree">Tree</button><button data-side="list">List</button></div>
    </div>
    <div id="tree-board" class="sheet-body"><div id="tree-layer"><svg id="tree-edges"></svg><div id="tree-nodes"></div></div></div>
    <div id="tree-list" class="sheet-body" hidden></div>
  </div>
</div>
<div id="pins"><button id="waiting-pin" class="pin" data-pin="waiting" aria-label="Next waiting page" hidden></button><button id="zoom-pin" class="pin icon-pin" data-pin="zoom" aria-pressed="false" title="Zoom into this tree · Ctrl+Shift+E" aria-label="Zoom into this tree" hidden></button></div>

<div id="start" class="surface dapple" hidden>
  <div id="start-column">
    <button id="start-search"> <i class="caret"></i><span>An address, a search, or anything on this page</span><kbd>Ctrl K</kbd></button>
    <div id="start-content"></div>
  </div>
</div>

<div id="forest" class="overlay" hidden>
  <div class="scrim"></div>
  <div class="forest-pop">
    <div class="forest-toolbar">
      <strong>Forest</strong>
      <span class="menu-detail" id="forest-count"></span>
      <div class="spacer"></div>
      <button class="action" id="forest-titles">Titles</button>
      <button class="action" id="forest-fit">Fit</button>
      <button class="action" id="forest-close" aria-label="Close the forest view">×</button>
    </div>
    <div id="forest-canvas" class="dapple">
      <div id="forest-layer"><svg id="forest-edges" width="1" height="1"></svg><div id="forest-nodes"></div></div>
    </div>
  </div>
</div>

<div id="card" hidden></div>
<div id="popover" hidden></div>

<div id="palette" hidden>
  <div class="scrim"></div>
  <div class="palette-box">
    <div class="palette-context" id="palette-context"></div>
    <div class="palette-field"><span id="palette-icon"></span><input id="palette-input" spellcheck="false" autocomplete="off" placeholder="Search your forest or type an address"></div>
    <div id="palette-results"></div>
    <div class="palette-foot">↑↓ choose · Enter open · Alt+Enter in a new tree · Esc close</div>
  </div>
</div>

<div id="form-return" hidden>
  <div class="scrim"></div>
  <div class="form-return-box" role="dialog" aria-modal="true" aria-labelledby="form-return-title">
    <h2 id="form-return-title">Return to a form result?</h2>
    <p>This page came from a form you sent. Opening it again may send the same data again, which can repeat an order or a payment.</p>
    <div><button id="form-return-cancel">Cancel</button><button id="form-return-continue">Continue</button></div>
  </div>
</div>
<div id="reader" hidden>
  <div class="scrim"></div>
  <div class="reader-box" id="reader-box"></div>
</div>

<div id="toast" hidden></div>

<script src="chrome.js"></script>
</body>
</html>

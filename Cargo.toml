[package]
name = "canopy"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
description = "A personal browser where browsing forms trees."
license = "MIT"

[features]
default = ["desktop"]
desktop = ["dep:gtk", "dep:gdk", "dep:glib", "dep:gio", "dep:webkit2gtk", "dep:wry", "dep:javascriptcore", "dep:soup3"]
gui-smoke = ["desktop"]

[dependencies]
anyhow = "1"
rusqlite = "0.37"
ulid = "1"
url = "2.5"
gtk = { version = "0.18", optional = true }
gdk = { version = "0.18", optional = true }
glib = { version = "0.18", optional = true }
gio = { version = "0.18", optional = true }
webkit2gtk = { version = "2.0", features = ["v2_40"], optional = true }
wry = { version = "=0.57.2", default-features = false, features = ["os-webview"], optional = true }
serde_json = "1"
javascriptcore = { package = "javascriptcore-rs", version = "1.1", optional = true }

aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
sha1 = "0.10"
sha2 = "0.10"
aes-gcm = "0.10"
zeroize = "1"
secret-service = { version = "4", features = ["rt-async-io-crypto-rust"] }
soup3 = { version = "0.5", optional = true }
tempfile = "3"

[[bin]]
name = "canopy"
path = "src/main.rs"
required-features = ["desktop"]

[[test]]
name = "webkit_smoke"
path = "tests/webkit_smoke.rs"
harness = false
required-features = ["gui-smoke"]

[[test]]
name = "reading_smoke"
path = "tests/reading_smoke.rs"
harness = false
required-features = ["gui-smoke"]

[[test]]
name = "sandbox_smoke"
path = "tests/sandbox_smoke.rs"
harness = false
required-features = ["gui-smoke"]

[[test]]
name = "open_url_smoke"
path = "tests/open_url_smoke.rs"
harness = false
required-features = ["gui-smoke"]

[[test]]
name = "download_smoke"
path = "tests/download_smoke.rs"
harness = false
required-features = ["gui-smoke"]

[[test]]
name = "shortcut_smoke"
path = "tests/shortcut_smoke.rs"
harness = false
required-features = ["gui-smoke"]

[[test]]
name = "history_smoke"
path = "tests/history_smoke.rs"
harness = false
required-features = ["gui-smoke"]

[profile.dev]
debug = 1

[[test]]
name = "profile_smoke"
path = "tests/profile_smoke.rs"
harness = false
required-features = ["gui-smoke"]

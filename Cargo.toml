[package]
name = "canopy"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
description = "A personal browser where browsing forms trees."
license = "MIT"

[features]
default = ["desktop"]
desktop = ["dep:gtk", "dep:gdk", "dep:glib", "dep:gio", "dep:webkit2gtk", "dep:wry", "dep:serde_json", "dep:javascriptcore"]
gui-smoke = ["desktop"]

[dependencies]
anyhow = "1"
rusqlite = "0.37"
ulid = "1"
url = "2.5"
gtk = { version = "0.18", optional = true }
gdk = { version = "0.18", optional = true }
glib = { version = "0.18", optional = true }
gio = { version = "0.18", optional = true }
webkit2gtk = { version = "2.0", features = ["v2_40"], optional = true }
wry = { version = "=0.57.2", default-features = false, features = ["os-webview"], optional = true }
serde_json = { version = "1", optional = true }
javascriptcore = { package = "javascriptcore-rs", version = "1.1", optional = true }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "canopy"
path = "src/main.rs"
required-features = ["desktop"]

[[test]]
name = "webkit_smoke"
path = "tests/webkit_smoke.rs"
harness = false
required-features = ["gui-smoke"]

[[test]]
name = "reading_smoke"
path = "tests/reading_smoke.rs"
harness = false
required-features = ["gui-smoke"]

[profile.dev]
debug = 1
